<main class="min-h-[80vh] flex items-center justify-center px-4 py-16 animate-fade-in relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-100 dark:bg-primary-950/30 rounded-full blur-3xl opacity-60"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-indigo-100 dark:bg-indigo-950/30 rounded-full blur-3xl opacity-60"></div>
  </div>
  <div class="relative text-center max-w-lg">
    <div class="mb-8" aria-hidden="true">
      <div class="text-[140px] leading-none font-black text-slate-100 dark:text-slate-800 select-none">404</div>
    </div>

    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white mb-4">
      Page introuvable
    </h1>

    <p class="text-slate-500 dark:text-slate-400 text-base mb-10 leading-relaxed">
      La page demandée n'existe pas ou l'identifiant du Pokémon est invalide.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button
        (click)="goHome()"
        class="btn-primary">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Retour à l'accueil
      </button>
      <button
        (click)="goToPokemon()"
        class="btn-secondary">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
        </svg>
        Voir le Pokédex
      </button>
    </div>
  </div>
</main>
