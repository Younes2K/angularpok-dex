<main class="min-h-[80vh] flex flex-col items-center justify-center px-4 py-16 animate-fade-in relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-0 left-0 right-0 h-80 bg-gradient-to-br from-primary-50 to-indigo-50 dark:from-slate-900 dark:to-indigo-950/50"></div>
    <div class="absolute top-1/4 -left-24 w-72 h-72 bg-primary-100/60 dark:bg-primary-900/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 w-72 h-72 bg-indigo-100/60 dark:bg-indigo-900/20 rounded-full blur-3xl"></div>
  </div>
  <div class="relative w-full max-w-xl">
    <div class="text-center mb-10">
      <div class="w-16 h-16 bg-primary-100 dark:bg-primary-900/50 rounded-2xl flex items-center justify-center mx-auto mb-5">
        <svg class="w-8 h-8 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <h1 class="text-4xl font-extrabold text-slate-800 dark:text-white mb-3">Rechercher un Pokémon</h1>
      <p class="text-slate-500 dark:text-slate-400 text-base">
        Saisissez le nom d'un Pokémon pour accéder à sa fiche
      </p>
    </div>

    <form [formGroup]="searchForm" (ngSubmit)="search()" class="mb-8" novalidate>
      <div class="flex gap-3">
        <div class="flex-1">
          <input
            formControlName="query"
            type="text"
            placeholder="Ex: pikachu, charizard..."
            class="input-field"
            [class.border-red-400]="queryControl.invalid && queryControl.touched"
            [class.focus:ring-red-400]="queryControl.invalid && queryControl.touched"
            autocomplete="off"
            aria-label="Nom du Pokémon"
          />
          <div
            *ngIf="queryControl.invalid && queryControl.touched"
            class="mt-2 text-sm text-red-500 font-medium">
            <span *ngIf="queryErrors['required']">Ce champ est requis</span>
            <span *ngIf="queryErrors['minlength']">Minimum 3 caractères requis</span>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="searchForm.invalid || state.loading"
          class="btn-primary shrink-0 px-6">
          <svg *ngIf="!state.loading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <svg *ngIf="state.loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </div>
    </form>

    <div *ngIf="state.error" class="card p-8 text-center animate-slide-up">
      <div class="w-12 h-12 bg-red-100 dark:bg-red-900/30 rounded-xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </div>
      <p class="text-slate-600 dark:text-slate-400 font-medium mb-4">{{ state.error }}</p>
      <button (click)="reset()" class="btn-secondary">Nouvelle recherche</button>
    </div>

    <div *ngIf="state.result && !state.error" class="animate-slide-up">
      <app-pokemon-card [pokemon]="state.result"></app-pokemon-card>
      <div class="flex gap-3 mt-4">
        <button (click)="viewDetail()" class="btn-primary flex-1">
          Voir les détails
        </button>
        <button (click)="reset()" class="btn-secondary">
          Nouvelle recherche
        </button>
      </div>
    </div>

    <div
      *ngIf="state.searched && !state.result && !state.error && !state.loading"
      class="card p-8 text-center animate-slide-up">
      <div class="w-12 h-12 bg-slate-100 dark:bg-slate-700 rounded-xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p class="text-slate-600 dark:text-slate-400 font-medium">Aucun Pokémon trouvé</p>
    </div>
  </div>
</main>
