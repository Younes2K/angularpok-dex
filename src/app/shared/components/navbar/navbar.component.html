<nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <button (click)="navigateTo('/')" class="flex items-center gap-2 group focus:outline-none">
        <div class="w-8 h-8 relative" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8">
            <circle cx="20" cy="20" r="19" class="stroke-primary-600 dark:stroke-primary-400" stroke-width="2"/>
            <path d="M1 20 A19 19 0 0 1 39 20 Z" class="fill-primary-600 dark:fill-primary-400"/>
            <line x1="1" y1="20" x2="39" y2="20" class="stroke-primary-600 dark:stroke-primary-400" stroke-width="2"/>
            <circle cx="20" cy="20" r="7" class="stroke-primary-600 dark:stroke-primary-400" stroke-width="2" fill="white"/>
            <circle cx="20" cy="20" r="3.5" class="fill-primary-600 dark:fill-primary-400"/>
          </svg>
        </div>
        <span class="text-xl font-extrabold text-primary-600 dark:text-primary-400 group-hover:text-primary-700 transition-colors">
          Pokédex
        </span>
      </button>

      <div class="hidden md:flex items-center gap-1">
        <button
          (click)="navigateTo('/pokemon')"
          [class.text-primary-600]="isActive('/pokemon')"
          [class.dark:text-primary-400]="isActive('/pokemon')"
          [class.font-semibold]="isActive('/pokemon')"
          class="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary-600 transition-all duration-200 font-medium">
          Pokémon
        </button>
        <button
          (click)="navigateTo('/search')"
          [class.text-primary-600]="isActive('/search')"
          [class.dark:text-primary-400]="isActive('/search')"
          [class.font-semibold]="isActive('/search')"
          class="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary-600 transition-all duration-200 font-medium">
          Recherche
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500"
          [attr.aria-label]="(isDark$ | async) ? 'Activer le mode clair' : 'Activer le mode sombre'">
          <svg *ngIf="!(isDark$ | async)" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg *ngIf="(isDark$ | async)" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>

        <button
          (click)="menuOpen = !menuOpen"
          class="md:hidden p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 focus:outline-none"
          aria-label="Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!menuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="menuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div *ngIf="menuOpen" class="md:hidden pb-3 flex flex-col gap-1 animate-fade-in">
      <button
        (click)="navigateTo('/pokemon')"
        class="w-full text-left px-4 py-3 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-all">
        Pokémon
      </button>
      <button
        (click)="navigateTo('/search')"
        class="w-full text-left px-4 py-3 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-all">
        Recherche
      </button>
    </div>
  </div>
</nav>
